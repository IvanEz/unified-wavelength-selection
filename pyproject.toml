[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wlselect"
version = "1.0.0"
description = "A unified framework for wavelength selection in diffuse (NIR) spectroscopy: concentration/spectral-fit preservation, model/data orthogonality and projection maximization."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kevin Scibilia" },
    { name = "Marcel Rosier" },
    { name = "Ivan Ezhov", email = "ivan.ezhov@tum.de" },
]
keywords = [
    "spectroscopy",
    "near-infrared",
    "NIRS",
    "hyperspectral",
    "wavelength selection",
    "band selection",
    "Beer-Lambert",
    "feature selection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "tqdm>=4.60",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.5"]

[project.scripts]
wlselect = "wlselect.cli:main"

[project.urls]
Paper = "https://arxiv.org/abs/2606.23223"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wlselect.resources" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP007", "B905"]
